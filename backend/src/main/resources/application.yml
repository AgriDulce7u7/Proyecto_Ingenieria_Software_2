# =====================================================================
# SIGCA-EPQ Backend - Configuración
# Las credenciales se leen del archivo .env de la raíz del repositorio
# (el mismo que usa docker-compose). No se versionan credenciales.
# =====================================================================
spring:
  application:
    name: sigca-epq-backend
  config:
    # Importa el .env tanto si se ejecuta desde /backend como desde la raíz del repo
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:epq_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    # El esquema lo administra database/init/01_schema.sql, Hibernate NO lo modifica.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
          batch_size: 50
    show-sql: false
  jackson:
    time-zone: America/Bogota
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ---------------------------------------------------------------------
# Parámetros propios de la aplicación (ver clase AppProperties)
# ---------------------------------------------------------------------
app:
  zona-horaria: America/Bogota
  cors:
    allowed-origins:
      - http://localhost:5173   # Vite
      - http://localhost:3000   # Create React App
  pqr:
    horas-alerta-vencimiento: 48          # SWR-07
    monitoreo-cron: "0 */15 * * * *"      # cada 15 minutos revisa plazos y vencimientos
  facturacion:
    ejecucion-automatica: true            # SWR-01
    cron: "0 0 1 * * *"                   # todos los días a la 01:00 verifica si es el primer día hábil
    dias-para-vencimiento: 15             # días calendario entre emisión y vencimiento de la factura
    tiempo-maximo-lote-minutos: 60        # SWR-02 (se registra alerta en log si se excede)
  erp:
    modo: simulado                        # simulado | rest   (IS-01)
    url: http://localhost:9090/api/erp    # solo aplica en modo rest
    max-intentos: 3
    espera-entre-intentos-ms: 200
    simulado:
      tasa-fallo: 0.0                     # 0.0 - 1.0; permite demostrar errores de sincronización
